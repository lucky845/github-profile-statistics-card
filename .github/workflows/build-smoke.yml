name: build-and-smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 仓库已是纯 Rust：没有 package.json、tsconfig、jest、node_modules 参与任何环节。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Cargo.lock 是构建契约：依赖漂移必须在这里失败，而不是在镜像构建时。
      - name: Build
        run: cargo build --release --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      # --all-targets 让测试代码也被 lint：单测里的 panic/indexing 同样是代码，不该因为
      # "只在测试里跑"就免检。
      - name: Lint
        run: cargo clippy --release --locked --all-targets --workspace -- -D warnings

      # 二进制必须自足：只允许 libc 这类系统库，不许有 Node 运行时或外部模块。
      - name: Verify the binary is self-contained
        run: |
          test -x target/release/app || { echo "二进制缺失，构建产物不完整"; exit 1; }
          echo "--- ldd ---"
          ldd target/release/app || true
          if ldd target/release/app 2>/dev/null | grep -qi 'node'; then
            echo "::error::二进制仍然链接到 Node 运行时"; exit 1
          fi

      # 干净环境启动冒烟：不配 GITHUB_TOKEN / BILIBILI_SESSDATA 也必须能起来。
      - name: Start server and smoke test
        env:
          PORT: 8080
        run: |
          set -uo pipefail
          ./target/release/app > server.log 2>&1 &
          echo $! > server.pid
          ready=0
          for i in $(seq 1 60); do
            # 用 /livez 等启动：/health 报的是外部平台状态，缺上游凭据时会一直 unhealthy。
            if curl -fsS -m 2 http://127.0.0.1:8080/livez > /dev/null 2>&1; then
              echo "服务在 ${i} 秒内就绪"
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            echo "--- 进程状态 ---"
            ps -p "$(cat server.pid)" -o pid,stat,etime,cmd 2>/dev/null || echo "进程已退出"
            echo "--- 服务日志全文 ---"
            cat server.log 2>/dev/null || echo "无 server.log"
            echo "::error::服务在 60 秒内未就绪（端口 8080 无法访问）"
            exit 1
          fi

          # 零子进程：曾经的 Node 兜底转发进程必须彻底不存在。
          children=$(pgrep -P "$(cat server.pid)" | wc -l)
          echo "子进程数: $children"
          test "$children" -eq 0 || { echo "::error::二进制拉起了子进程，Node 兜底进程回归了"; exit 1; }

          echo "--- /health ---"
          curl -fsS -m 10 http://127.0.0.1:8080/health
          echo
          echo "--- 主页 ---"
          curl -fsS -m 10 http://127.0.0.1:8080/ | grep -q "个人主页统计卡片" && echo "主页 OK"
          echo "--- 404 形态 ---"
          curl -s -o /dev/null -w 'status=%{http_code}\n' http://127.0.0.1:8080/definitely-not-a-route

      # Vercel 入口与服务端二进制共用 app::router()，但它是独立的二进制：Vercel 的 Rust 框架
      # 检测到 Cargo.toml + src/main.rs 后会自己编译它，进程只需监听 $PORT。这里直接跑它验证。
      - name: Vercel entry point smoke
        env:
          PORT: 3000
        run: |
          set -uo pipefail
          ./target/release/gpsc-vercel > vercel.log 2>&1 &
          echo $! > vercel.pid
          for i in $(seq 1 30); do
            curl -fsS -m 2 http://127.0.0.1:3000/livez > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -m 5 http://127.0.0.1:3000/health > /dev/null && echo "vercel /health OK"
          curl -fsS -m 5 http://127.0.0.1:3000/ | grep -q "个人主页统计卡片" && echo "vercel 主页 OK"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:3000/definitely-not-a-route)
          test "$code" = "404" || { echo "::error::Vercel 入口 404 形态不对: $code"; exit 1; }
          kill "$(cat vercel.pid)" 2>/dev/null || true

      - name: Stop server
        if: always()
        run: |
          [ -f server.pid ] && kill "$(cat server.pid)" 2>/dev/null || true
          tail -40 server.log 2>/dev/null || true

      # Dockerfile 是部署契约：镜像里不允许出现 Node。
      - name: Docker image smoke
        run: |
          docker build -t gpsc-ci .
          docker run --rm gpsc-ci sh -c 'command -v node || echo "no node in image"'