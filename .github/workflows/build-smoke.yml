name: build-and-smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 仓库已是纯 Rust：没有 package.json、tsconfig、jest、node_modules 参与任何环节。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Cargo.lock 是构建契约：依赖漂移必须在这里失败，而不是在镜像构建时。
      - name: Build
        run: cargo build --release --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      # --all-targets 让测试代码也被 lint：单测里的 panic/indexing 同样是代码，不该因为
      # "只在测试里跑"就免检。
      - name: Lint
        run: cargo clippy --release --locked --all-targets --workspace -- -D warnings

      # 行为契约门：111 条纯本地 case 必须全绿。
      #
      # 为什么是 111 而不是全部 153：其余 41 条是**成功渲染的**卡片（每张都要打上游），
      # 外加一条 cache-stats（上报本次 run 的计数）。它们依赖 GitHub 匿名配额、CSDN
      # 存活状态和录制当天的日期，在 CI 里跑只会得到和代码无关的红灯——实测同样的代码
      # 连跑两遍能给出 148 和 147 两种结果。这 111 条不打上游、不看时间，稳定全绿。
      #
      # 6 条 404 的卡片故意留在门内：它们由 404 处理器直接渲染、不打上游，守的是
      # 「平台挂载了但 404 回了 JSON」这类缺陷（juejin 就这么漏了一整代）。撤掉那个
      # 修复，这道门立刻 110/111。
      #
      # rust-anything 本身是 Node 工具，用它验证不等于二进制依赖 Node——上面那条
      # self-contained 检查依然在，且跑的是 target/release/app 这个纯 Rust 产物。
      - name: Behaviour gate (111 hermetic replay cases)
        run: |
          set -uo pipefail
          npm install --global rust-anything@2.1.0 > /dev/null
          rust-anything --version
          REPLAY_APP_BIN="$PWD/target/release/app" ./scripts/replay.sh gate

      # 二进制必须自足：只允许 libc 这类系统库，不许有 Node 运行时或外部模块。
      - name: Verify the binary is self-contained
        run: |
          test -x target/release/app || { echo "二进制缺失，构建产物不完整"; exit 1; }
          echo "--- ldd ---"
          ldd target/release/app || true
          if ldd target/release/app 2>/dev/null | grep -qi 'node'; then
            echo "::error::二进制仍然链接到 Node 运行时"; exit 1
          fi

      # 进程年龄的端到端检查：单元测试抓不住的那一半。
      #
      # /livez 的 uptime 曾经来自一个 OnceLock，在「第一次被问到」时才起表 —— 一个跑了 8 秒的
      # 进程回答 uptime: 0。tests/live_diagnostics.rs 里那条测试区分不了这个缺陷：那个秒表的
      # 起点和测试自己取基准的时刻几乎同时，两种实现给出的数都 >= 1。
      #
      # 能区分的是跨进程的观察：起进程、沉默等待、只问一次。沉默这段是必须的 —— 下面的
      # 「Start server and smoke test」用 /livez 轮询就绪，那种轮询本身就是第一次探测，会把
      # 秒表该有的提前量交给它。所以这里改探 TCP 端口（不产生 HTTP 请求），等满 5 秒再问。
      - name: Process age is measured from the kernel (end-to-end)
        run: APP_BIN="$PWD/target/release/app" ./scripts/process-age.sh

      # 干净环境启动冒烟：不配 GITHUB_TOKEN / BILIBILI_SESSDATA 也必须能起来。
      - name: Start server and smoke test
        env:
          PORT: 8080
        run: |
          set -uo pipefail
          ./target/release/app > server.log 2>&1 &
          echo $! > server.pid
          ready=0
          for i in $(seq 1 60); do
            # 用 /livez 等启动：/health 报的是外部平台状态（data.status 可能是 unknown/
            # unhealthy），那份读数跟进程有没有起来无关。
            if curl -fsS -m 2 http://127.0.0.1:8080/livez > /dev/null 2>&1; then
              echo "服务在 ${i} 秒内就绪"
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            echo "--- 进程状态 ---"
            ps -p "$(cat server.pid)" -o pid,stat,etime,cmd 2>/dev/null || echo "进程已退出"
            echo "--- 服务日志全文 ---"
            cat server.log 2>/dev/null || echo "无 server.log"
            echo "::error::服务在 60 秒内未就绪（端口 8080 无法访问）"
            exit 1
          fi

          # 零子进程：曾经的 Node 兜底转发进程必须彻底不存在。
          # pgrep 无匹配时返回 1，pipefail 会让这条管道以 1 退出、bash -e 直接杀脚本——
          # 于是「健康态（零子进程）」反而成了假失败。用 || true 只保留 wc 的计数。
          children=$(pgrep -P "$(cat server.pid)" | wc -l || true)
          echo "子进程数: $children"
          test "$children" -eq 0 || { echo "::error::二进制拉起了子进程，Node 兜底进程回归了"; exit 1; }

          echo "--- /health ---"
          curl -fsS -m 10 http://127.0.0.1:8080/health
          echo
          echo "--- 主页 ---"
          curl -fsS -m 10 http://127.0.0.1:8080/ | grep -q "个人主页统计卡片" && echo "主页 OK"
          echo "--- 404 形态 ---"
          curl -s -o /dev/null -w 'status=%{http_code}\n' http://127.0.0.1:8080/definitely-not-a-route

      # 只有一份二进制了：Docker 与 Vercel 都是"监听 $PORT 的 axum 服务"，由平台侧转发。
      # 这一步验证它在 Vercel 期望的端口（$PORT 注入）下能起来，并回答正确的形态。
      # 端口换成 3000 而不是 8080，就是为了证明它真的读 $PORT 而不是写死。
      - name: PORT-driven startup (Vercel shape)
        env:
          PORT: 3000
        run: |
          set -uo pipefail
          ./target/release/app > port.log 2>&1 &
          echo $! > port.pid
          for i in $(seq 1 30); do
            curl -fsS -m 2 http://127.0.0.1:3000/livez > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -m 5 http://127.0.0.1:3000/health > /dev/null && echo "\$PORT /health OK"
          curl -fsS -m 5 http://127.0.0.1:3000/ | grep -q "个人主页统计卡片" && echo "\$PORT 主页 OK"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:3000/definitely-not-a-route)
          test "$code" = "404" || { echo "::error::404 形态不对: $code"; exit 1; }
          kill "$(cat port.pid)" 2>/dev/null || true

      - name: Stop server
        if: always()
        run: |
          [ -f server.pid ] && kill "$(cat server.pid)" 2>/dev/null || true
          tail -40 server.log 2>/dev/null || true

      # Dockerfile 是部署契约：镜像里不允许出现 Node。
      - name: Docker image smoke
        run: |
          docker build -t gpsc-ci .
          docker run --rm gpsc-ci sh -c 'command -v node || echo "no node in image"'