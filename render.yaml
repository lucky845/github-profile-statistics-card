services:
  - type: web
    name: github-profile-statistics-card
    runtime: node
    plan: free
    region: singapore   # 离中国大陆最近的一个区，冷路径少跨半个地球
    branch: main
    # 必须带 devDependencies，否则没有 tsc，构建直接失败
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/src/app.js
    # 活跃探针用 /livez：/health 报告的是数据库连通性，缺 DB 时会一直 unhealthy
    healthCheckPath: /livez
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # PORT 由 Render 自动注入，app.config.ts 已读取 process.env.PORT
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
