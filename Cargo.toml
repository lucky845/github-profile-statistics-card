# Vercel 的 Rust runtime 在仓库根目录执行 cargo build，所以 workspace 必须落在根上。
# 根上同时是一个 package：它的唯一用途是编译 api/index.rs 这个 serverless 入口。
# 服务端二进制（Docker / 本地）仍然是 rust/app 里的那个，两者共用同一个 lib。
[package]
name = "gpsc-vercel"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "index"
path = "api/index.rs"

[dependencies]
app = { path = "rust/app" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }

[workspace]
members = ["rust/app", "rust/svg", "rust/utils", "rust/platforms-rs"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"