[request]
method = "GET"
path = "/rust-anything-missing"

[response]
status = 404

[response.headers]
content-security-policy = "default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data: *;base-uri 'self';font-src 'self' https: data:;form-action 'self';frame-ancestors 'self';object-src 'none';script-src-attr 'none';upgrade-insecure-requests"
content-type = "application/json; charset=utf-8"
cross-origin-opener-policy = "same-origin"
cross-origin-resource-policy = "same-origin"
origin-agent-cluster = "?1"
referrer-policy = "no-referrer"
strict-transport-security = "max-age=15552000; includeSubDomains"
vary = "Origin"
x-cache-key = "http:GET:_rust_anything_missing:"
x-cache-status = "MISS"
x-content-type-options = "nosniff"
x-dns-prefetch-control = "off"
x-download-options = "noopen"
x-frame-options = "DENY"
x-permitted-cross-domain-policies = "none"
x-xss-protection = "[..]"
