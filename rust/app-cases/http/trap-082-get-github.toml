[request]
method = "GET"
path = "/github/octocat?theme=%F0%9F%91%8D%F0%9F%8F%BD%20thumbs"

[response]
status = 200

[response.headers]
cache-control = "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400"
content-security-policy = "default-src 'self';script-src 'self';style-src 'self';img-src 'self' data: *;base-uri 'self';font-src 'self' https: data:;form-action 'self';frame-ancestors 'self';object-src 'none';script-src-attr 'none';upgrade-insecure-requests"
content-type = "image/svg+xml; charset=utf-8"
cross-origin-opener-policy = "same-origin"
cross-origin-resource-policy = "same-origin"
origin-agent-cluster = "?1"
referrer-policy = "no-referrer"
strict-transport-security = "max-age=15552000; includeSubDomains"
vary = "Origin"
x-cache-key = "http:GET:_github_octocat:theme______thumbs"
x-cache-status = "[..]"
x-content-type-options = "nosniff"
x-dns-prefetch-control = "off"
x-download-options = "noopen"
x-frame-options = "DENY"
x-permitted-cross-domain-policies = "none"
x-xss-protection = "[..]"
